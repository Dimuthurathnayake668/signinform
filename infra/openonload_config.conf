# PREDATOR 2026 — openonload_config.conf
# SCRUM-18 | Phase 0 | Spec §3.5
# OpenOnload ef_vi global configuration
# Installed to /etc/OpenOnload/onload.conf

# Use hardware timestamping on all ef_vi sockets
EF_TX_TIMESTAMPING=1
EF_RX_TIMESTAMPING=1

# Spin-poll (busy-wait) for lowest latency — matches isolcpus=0-15 from SCRUM-15
# Cores 0-1 are OpenOnload poll cores (SCHED_FIFO 99)
EF_POLL_USEC=-1       # -1 = spin forever (no timeout)

# Disable Nagle algorithm
EF_NONAGLE=1

# Packet buffer configuration
EF_MAX_PACKETS=131072

# Use huge pages for DMA buffers
EF_USE_HUGE_PAGES=2   # 2 = always

# Separate stack per thread (hot-path threads 2-15 each get their own ef_vi VI)
EF_STACK_PER_THREAD=1

# Disable TCP offload (we use UDP for market data, raw socket for order entry)
EF_TCP_RECV_SPIN=0

# Interface → zone mapping (Zone A = hot path; Zone B = management)
# Market data (port 0): EF_VI stack "predator_mkt"
# Order entry (port 1): EF_VI stack "predator_oe"
# These are applied per-socket via onload_set_stackname() in ingestion_gateway.rs

# NO DPDK — OpenOnload only. See SCRUM-18 acceptance criteria.
