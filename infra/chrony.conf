# PREDATOR 2026 — chrony.conf
# SCRUM-17 | Phase 0 | Spec §4.2
#
# NTP FALLBACK ONLY — active only when GPS PTP grandmaster is unreachable.
# Under normal operation ptp4l + phc2sys provide sub-microsecond sync.
# Chrony is disabled at boot; the ptp_watchdog.sh enables it on GPS failure.

# Stratum-1 NTP servers (public, diverse geography)
server 0.pool.ntp.org iburst minpoll 4 maxpoll 6
server 1.pool.ntp.org iburst minpoll 4 maxpoll 6
server 2.pool.ntp.org iburst minpoll 4 maxpoll 6

# Use hardware timestamp on Solarflare NIC if PTP socket available
# hwtimestamp eth0

# Don't allow NTP clients — this node is a client only
port 0

# Allow stepping the clock on startup (not slewing) for fast convergence
makestep 1.0 3

# Record drift compensations
driftfile /var/lib/chrony/drift

# Log sync events (for drift_metrics logging)
logdir /var/log/chrony
log measurements statistics tracking

# Only accept time adjustments up to 100ms — larger means GPS is recovering
maxdistance 0.1

# Alert comment: chrony activation means GPS/PTP has failed.
# Log a CRITICAL alert to syslog whenever chrony starts stepping the clock.
# The ptp_watchdog.sh monitors ptp4l status and activates chrony automatically.
